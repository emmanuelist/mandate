# Manifest without a fork, for the suites that touch only local contracts (#45):
# they run in seconds and send nothing to Hiro's API.
# Run: npx vitest run --config vitest.local.config.ts
[project]
name = "mandate-local"
description = "The vault's local suites, with no mainnet fork"
authors = []
telemetry = false
cache_dir = "./.cache"

[contracts.sip-010-trait]
path = "contracts/sip-010-trait.clar"
epoch = "latest"
clarity_version = 4

